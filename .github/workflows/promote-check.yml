# Promote Check — verifies _INDEX.csv integrity before a PR can enter main.
# Orthogonal to Skill Gate (security). This job checks the registry, not the bundle.
#
# Runs when a PR to main touches:
#   - any SKILL.md or scripts/ inside a skill directory
#   - _INDEX.csv directly
#
# Does NOT write _INDEX.csv. CI only verifies. The PR author fills the row.
# Green CI + human merge = promote. Promote != deploy.

name: Promote Check

on:
  pull_request:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - '**/scripts/**'
      - '_INDEX.csv'

permissions:
  contents: read

jobs:
  index-check:
    name: Index integrity check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed skills and INDEX rows
        id: find
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${BASE_REF}" --depth=1

          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          # ── From SKILL.md / scripts changes (same logic as skill-gate) ──────
          declare -A SEEN
          SKILL_LIST=()

          find_skill_root() {
            local dir
            dir=$(dirname "$1")
            while [ "$dir" != "." ] && [ -n "$dir" ]; do
              if [ -f "${dir}/SKILL.md" ]; then
                printf '%s' "$dir"
                return 0
              fi
              dir=$(dirname "$dir")
            done
            return 1
          }

          while IFS= read -r file; do
            [[ "$file" == _archivo/* ]] && continue
            root=$(find_skill_root "$file") || continue
            if [[ ! "${SEEN[$root]+_}" ]]; then
              SEEN[$root]=1
              SKILL_LIST+=("$root")
            fi
          done <<< "$CHANGED"

          # ── From _INDEX.csv changes: extract ruta_biblioteca of touched rows ─
          if echo "$CHANGED" | grep -qx "_INDEX.csv"; then
            while IFS= read -r dir; do
              [[ -z "$dir" ]] && continue
              [[ "$dir" == _archivo/* ]] && continue
              if [[ ! "${SEEN[$dir]+_}" ]]; then
                SEEN[$dir]=1
                SKILL_LIST+=("$dir")
              fi
            done < <(
              python3 - "${BASE_REF}" << 'PY'
import sys, subprocess, csv, io

base_ref = sys.argv[1]
diff_out = subprocess.check_output(
    ["git", "diff", "--unified=0", f"origin/{base_ref}...HEAD", "--", "_INDEX.csv"],
    text=True, errors="replace",
)

def normalize(ruta):
    r = ruta.strip().replace('\\', '/')
    for marker in ('skills-library/', 'skills_library/'):
        if marker in r:
            return r[r.index(marker) + len(marker):].rstrip('/')
    if r and ':' not in r and not r.startswith('/'):
        return r.rstrip('/')
    return None

seen = set()
for line in diff_out.splitlines():
    if not line.startswith('+') or line.startswith('+++'):
        continue
    line = line[1:].lstrip('﻿')
    try:
        row = next(csv.reader(io.StringIO(line)))
        # ruta_biblioteca is column index 8 (0-based)
        if len(row) > 8:
            rel = normalize(row[8])
            if rel and rel not in seen:
                seen.add(rel)
                print(rel)
    except Exception:
        pass
PY
            )
          fi

          if [ ${#SKILL_LIST[@]} -eq 0 ]; then
            echo "has-skills=false" >> "$GITHUB_OUTPUT"
            echo "skills_args="    >> "$GITHUB_OUTPUT"
            echo "No skill directories to check — promote-check skipped."
          else
            echo "has-skills=true" >> "$GITHUB_OUTPUT"
            # Space-separated list for passing to index-check.sh
            printf -v ARGS '%s ' "${SKILL_LIST[@]}"
            echo "skills_args=${ARGS}" >> "$GITHUB_OUTPUT"
            echo "Skills to check: ${SKILL_LIST[*]}"
          fi

      - name: Run index integrity check
        if: steps.find.outputs.has-skills == 'true'
        env:
          SKILLS: ${{ steps.find.outputs.skills_args }}
        run: |
          # shellcheck disable=SC2086
          bash scripts/index-check.sh $SKILLS
